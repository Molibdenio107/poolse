# The nightly backup — POOLSE-89.
#
# One encrypted pg_dump of production, with its manifest, into the backups'
# own bucket; backups older than 30 days are deleted (Rui, 21-10-2026). The
# age public key is the only key here: nothing in GitHub can open a backup.
# Whether it restores is proved by `pnpm --filter @poolse/db restore-drill`
# on Rui's machine (docs/deploy.md, "Backups and restoring").
#
# Secrets, on the `production` environment:
#   BACKUP_SOURCE_URL              the owner connection string (never DATABASE_APP_URL)
#   BACKUP_AGE_RECIPIENT           age1… — the public key
#   BACKUP_S3_ENDPOINT / BACKUP_S3_BUCKET / BACKUP_S3_ACCESS_KEY_ID / BACKUP_S3_SECRET_ACCESS_KEY
#   FILES_S3_BUCKET / FILES_S3_ACCESS_KEY_ID / FILES_S3_SECRET_ACCESS_KEY
#                                  the uploads bucket (poolse-production) and a token that may
#                                  only READ it; the backup token still cannot see it (QA 7)
#   PLATFORM_ALERT_EMAIL / RESEND_API_KEY / EMAIL_FROM   for the failure alert
# Variable: PG_TOOLS_IMAGE — postgres:<production's major>, e.g. postgres:16

name: Nightly backup

on:
  schedule:
    - cron: '30 2 * * *' # 02:30 UTC, the quiet hours in Lisbon
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    # Off until production exists and Rui sets the repository variable BACKUPS_ENABLED=true.
    if: vars.BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      PG_TOOLS: docker
      PG_TOOLS_IMAGE: ${{ vars.PG_TOOLS_IMAGE || 'postgres:16' }}
      BACKUP_SOURCE_URL: ${{ secrets.BACKUP_SOURCE_URL }}
      BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Back up
        run: pnpm --filter @poolse/db backup
      - name: Check what was written
        run: pnpm --filter @poolse/db check-backups
      # The uploads — atestados, ID photos, contracts (go-live review, 10-11-2026).
      # A mirror into the backups bucket under files/, through the runner with two
      # tokens: one that only reads the uploads, the backup one that only writes
      # its own bucket — neither reaches both (deploy.md QA 7). Deletions
      # are mirrored on purpose: the only thing the app ever deletes from the bucket
      # is a plaintext ID photo the re-seal script replaced, and a copy that kept it
      # would keep what the re-seal exists to remove. So a source that suddenly
      # holds far fewer files than its copy is refused, not mirrored: an emptied
      # bucket must not empty its backup the same night. Health files are
      # ciphertext already; the rest stays private to the bucket.
      - name: Mirror uploaded files
        env:
          FILES_S3_BUCKET: ${{ secrets.FILES_S3_BUCKET }}
          FILES_S3_ACCESS_KEY_ID: ${{ secrets.FILES_S3_ACCESS_KEY_ID }}
          FILES_S3_SECRET_ACCESS_KEY: ${{ secrets.FILES_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: |
          set -euo pipefail
          if [ -z "$FILES_S3_BUCKET" ] || [ -z "$FILES_S3_ACCESS_KEY_ID" ]; then
            echo "::error::FILES_S3_BUCKET or its read token is not set: uploaded files are not being backed up."
            exit 1
          fi
          # The uploads token reads; the backup token writes. Never one for both.
          uploads() { AWS_ACCESS_KEY_ID="$FILES_S3_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$FILES_S3_SECRET_ACCESS_KEY" \
                      aws --endpoint-url "$BACKUP_S3_ENDPOINT" s3 "$@"; }
          backups() { AWS_ACCESS_KEY_ID="$BACKUP_S3_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$BACKUP_S3_SECRET_ACCESS_KEY" \
                      aws --endpoint-url "$BACKUP_S3_ENDPOINT" s3 "$@"; }
          work="$RUNNER_TEMP/uploads"
          mkdir -p "$work"
          uploads sync "s3://$FILES_S3_BUCKET/" "$work/" --only-show-errors
          source_count=$(find "$work" -type f | wc -l)
          copy_count=$( (backups ls --recursive "s3://$BACKUP_S3_BUCKET/files/" || true) | wc -l)
          echo "uploads: $source_count file(s); copy before tonight: $copy_count file(s)"
          if [ "$copy_count" -gt 20 ] && [ $((source_count * 10)) -lt $((copy_count * 9)) ]; then
            echo "::error::The uploads bucket holds over 10% fewer files than its copy. Not mirroring; check the bucket."
            exit 1
          fi
          backups sync "$work/" "s3://$BACKUP_S3_BUCKET/files/" --delete --only-show-errors
          rm -rf "$work"
          echo "mirrored: $( (backups ls --recursive "s3://$BACKUP_S3_BUCKET/files/" || true) | wc -l) file(s)"
      - name: Alert
        if: failure()
        env:
          EMAIL_PROVIDER: resend
          PLATFORM_ALERT_EMAIL: ${{ secrets.PLATFORM_ALERT_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: pnpm --filter @poolse/db backup:alert "cópia de segurança noturna" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
